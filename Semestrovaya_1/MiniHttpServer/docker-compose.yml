services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: oriscards
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oriscards"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./docker/settings.json:/app/settings.json:ro
    stdin_open: true
    tty: true

volumes:
  pgdata: