<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование карты</title>
    <link rel="stylesheet" href="/css/site.css">
    <style>
        body { background: #0a0014; color: #fff; font-family: 'GothamNarrow', Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; margin-bottom: 2rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #dad9db; font-size: 1.4rem; }
        input, select, textarea { width: 100%; padding: 8px; background: #161621; border: 1px solid #434472; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 1.4rem; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #8257ed; }
        .error { background: #ff1c1c; color: #fff; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; text-align: center; font-weight: bold; }
        .btn { padding: 10px 20px; background: #5d5fc7; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1.4rem; font-family: inherit; }
        .btn:hover { background: #8257ed; }
        .btn-back { background: #444; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .btn-back:hover { background: #666; }
        .pt-row { display: flex; gap: 10px; }
        .pt-row input { flex: 1; }
    </style>
</head>
<body>
<h1>Редактирование карты</h1>
<a href="/admin/index" class="btn btn-back">← Назад к списку</a>

$if(Error)
<div class="error">${Error}</div>
$endif

<form action="/admin/edit?id=${Card.Id}" method="post">
    <div class="form-group">
        <label>Название (Name) *</label>
        <input type="text" name="name" value="${Card.Name}" required pattern="[A-Za-z0-9\s\-',.]{3,100}" title="3-100 символов, только латинские буквы, цифры, пробелы и дефисы" maxlength="100">
    </div>

    <div class="form-group">
        <label>Мана (Mana Cost)</label>
        <input type="text" name="manaCost" value="${Card.ManaCost}" pattern="(\d|[WUBRGCwubrgc]){0,10}" title="Только цифры и символы WUBRGC" maxlength="10">
    </div>

    <div class="form-group">
        <label>Тип (Type Line) *</label>
        <input type="text" name="typeLine" value="${Card.TypeLine}" required maxlength="200">
    </div>

    <div class="form-group">
        <label>Редкость *</label>
        <select name="rarityId" required>
            $foreach(var r in Rarities)
            $if(r.Id == Card.RarityId)
            <option value="${r.Id}" selected>${r.Name}</option>
            $else
            <option value="${r.Id}">${r.Name}</option>
            $endif
            $endfor
        </select>
    </div>

    <div class="form-group">
        <label>Художник *</label>
        <select name="artistId" required>
            $foreach(var a in Artists)
            $if(a.Id == Card.ArtistId)
            <option value="${a.Id}" selected>${a.Name}</option>
            $else
            <option value="${a.Id}">${a.Name}</option>
            $endif
            $endfor
        </select>
    </div>

    <div class="form-group">
        <label>Текст правил</label>
        <textarea name="rulesText" rows="4" maxlength="5000">${Card.RulesText}</textarea>
    </div>

    <div class="form-group">
        <label>Флейвор текст</label>
        <textarea name="flavorText" rows="2" maxlength="1000">${Card.FlavorText}</textarea>
    </div>

    <div class="form-group">
        <label>P/T (Сила/Выносливость)</label>
        <div class="pt-row">
            <input type="text" name="power" value="${Card.Power}" placeholder="Power" maxlength="10">
            <input type="text" name="toughness" value="${Card.Toughness}" placeholder="Toughness" maxlength="10">
        </div>
    </div>

    <div class="form-group">
        <label>URL Картинки</label>
        <input type="text" name="imageUrl" value="${Card.ImageUrl}" maxlength="500">
    </div>

    <button type="submit" class="btn">Сохранить</button>
</form>
</body>
<script src="/js/validation.js"></script>
</html>
