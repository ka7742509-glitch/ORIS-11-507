<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="/css/site.css">
    <style>
        body { background: #0a0014; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #434472; padding: 8px; text-align: left; }
        .btn { padding: 5px 10px; text-decoration: none; color: #fff; border-radius: 4px; display: inline-block; margin-right: 5px; }
        .btn-edit { background: #5d5fc7; }
        .btn-del { background: #ff1c1c; border: none; cursor: pointer; }
        .btn-add { background: #27c837; padding: 10px 20px; margin-bottom: 20px; }
    </style>
</head>
<body>
<h1>Управление картами</h1>
<a href="/admin/create" class="btn btn-add">+ Добавить карту</a>
<a href="/cards/list" class="btn" style="background:#444">На сайт</a>
<form action="/auth/logout" method="post" style="display:inline; float:right">
    <button type="submit" class="btn" style="background:#444; border:none; cursor:pointer">Выйти</button>
</form>

<table class="admin-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Номер</th>
        <th>Название</th>
        <th>Тип</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    $foreach(var card in Cards)
    <tr>
        <td>${card.Id}</td>
        <td>${card.Number}</td>
        <td>${card.Name}</td>
        <td>${card.TypeLine}</td>
        <td>
            <a href="/admin/edit?id=${card.Id}" class="btn btn-edit">Ред.</a>
            <form action="/admin/delete" method="post" style="display:inline" onsubmit="return confirm('Удалить карту?');">
                <input type="hidden" name="id" value="${card.Id}">
                <button type="submit" class="btn btn-del">Удалить</button>
            </form>
        </td>
    </tr>
    $endfor
    </tbody>
</table>
</body>
</html>
